<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="DIU.png" type="image/x-icon" />
    <title>Student Result Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📄 Check Your Result</h1>
        <form id="resultForm">
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" placeholder="Enter your Student ID" required>
            </div>

            <div class="form-group">
                <label for="semester">Select Semester</label>
                <select id="semester" required>
                    <option value="" disabled selected>Select Semester</option>
                    <option value="spring2025">Spring 2025</option>
                    <option value="fall2025">Fall 2025</option>
                    <option value="summer2025">Summer 2025</option>
                </select>
            </div>

            <button type="submit">View Result</button>
        </form>

        <div id="result" class="result-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
